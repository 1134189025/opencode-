<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Enhancer - OpenCode</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                </svg>
            </div>
            <h1>Prompt Enhancer</h1>
            <p>OpenCode 提示词液态增强</p>
        </div>

        <!-- Master Switch -->
        <div class="master-switch" id="masterSwitch">
            <div class="switch-info">
                <div class="switch-icon-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                </div>
                <div>
                    <div class="switch-label">提示词优化</div>
                    <div class="switch-status" id="switchStatus">已关闭</div>
                </div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="enableToggle">
                <div class="toggle-track"></div>
                <div class="toggle-thumb"></div>
            </label>
        </div>

        <!-- Bento Grid Settings -->
        <div class="bento-grid">
            <!-- API Settings -->
            <div class="bento-card">
                <div class="card-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    </svg>
                    <span class="card-title">API 配置</span>
                </div>

                <div class="field">
                    <label for="apiUrl">接口地址</label>
                    <input type="url" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions">
                </div>

                <div class="field">
                    <label for="apiKey">密钥 (API Key)</label>
                    <div class="password-wrap">
                        <input type="password" id="apiKey" placeholder="sk-...">
                        <button type="button" class="password-toggle" id="toggleKey" title="显示/隐藏">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="model">模型名称</label>
                    <div class="model-input-wrap" style="display: flex; gap: 8px;">
                        <input type="text" id="model" placeholder="gpt-4o-mini" style="flex: 1;">
                        <button type="button" class="btn btn-secondary" id="fetchModelsBtn" style="white-space: nowrap; padding: 0 12px; font-size: 13px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: -2px;">
                                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                                <path d="M16 16h5v5"></path>
                            </svg>
                            获取可用模型
                        </button>
                    </div>
                </div>

                <button class="btn-test" id="testBtn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2v17.5c0 1.4-1.1 2.5-2.5 2.5h0c-1.4 0-2.5-1.1-2.5-2.5V2" />
                        <path d="M8.5 2h7" />
                        <path d="M14.5 16h-5" />
                    </svg>
                    测试连接状态
                </button>
            </div>

            <!-- System Prompt -->
            <div class="bento-card">
                <div class="card-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" x2="8" y1="13" y2="13" />
                        <line x1="16" x2="8" y1="17" y2="17" />
                        <line x1="10" x2="8" y1="9" y2="9" />
                    </svg>
                    <span class="card-title">核心系统指令</span>
                </div>
                <div class="field">
                    <div class="profile-actions">
                        <div class="profile-tabs" id="profileTabs">
                            <!-- Tabs dynamically injected -->
                        </div>
                        <button type="button" class="btn-icon" id="addProfileBtn" title="新建预设">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <button type="button" class="btn-icon text-danger" id="deleteProfileBtn" title="删除当前预设" style="display: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </div>
                    <textarea id="systemPrompt" placeholder="定义如何将大白话转换为专业提示词..."></textarea>
                    <div class="hint">定义 AI 如何处理输入（支持 Markdown）</div>
                </div>
            </div>
        </div>
        <!-- History Panel (collapsible, spans full width) -->
        <div class="bento-card history-card" id="historyCard">
            <div class="card-header history-toggle" id="historyToggle">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="card-title">历史记录</span>
                <span class="history-badge" id="historyBadge">0</span>
                <span class="expand-arrow" id="historyArrow">▸</span>
            </div>
            <div class="history-list" id="historyList">
                <!-- dynamically injected -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
            <button class="btn btn-secondary" id="resetBtn" type="button">
                恢复默认
            </button>
            <button class="btn btn-primary" id="saveBtn" type="button">
                保存设置
            </button>
        </div>

        <div class="footer">
            配置文件 <code>prompt-enhancer-config.json</code>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>

</html>
